# broadcast-linux configuration: ~/.config/broadcast-linux/config.toml
# Apply: systemctl --user reload broadcast-linux
# Restart for mic/speaker/camera enabled, mic/speaker name, camera device/width/height.
# All enabled fields: true | false. All strength fields: 0.0..1.0.
# All mic effects off, or all camera effects off with no background: passthrough.

[mic]
enabled = true
# "default" | real mic node name (`broadcast-linux devices`).
# Set a real node name before making Broadcast Mic the default input.
input = "default"
# Noise removal; strength 0.0 = no effect, 1.0 = full effect.
noise_removal = { enabled = true, strength = 1.0 }
# Echo removal; combined with noise removal at the higher strength.
room_echo_removal = { enabled = false, strength = 1.0 }
# Studio mic voice; overrides noise/echo removal. No strength option.
studio_voice = { enabled = false }
# Whole minutes to retain the idle mic model after pausing; 0 = unload on pause.
unload_after_minutes = 10
# Device name shown to apps (any string).
name = "NVIDIA Broadcast Mic"

[speaker]
# Mono effects for call audio played to "NVIDIA Broadcast Speaker"; not for music.
enabled = false
# "default" | real output node name (`broadcast-linux devices`).
output = "default"
noise_removal = { enabled = true, strength = 1.0 }
room_echo_removal = { enabled = false, strength = 1.0 }
# Same as [mic] unload_after_minutes.
unload_after_minutes = 10
name = "NVIDIA Broadcast Speaker"

[camera]
enabled = true
# v4l2loopback output device path.
device = "/dev/video10"
# Real webcam device path.
input = "/dev/video0"
# "auto" | "mjpeg" | "yuyv" | "nv12". auto prefers MJPEG, then raw, at the size below.
input_format = "auto"
# "auto" | "bt601" | "bt601_full" | "bt709" | "bt709_full": colors of YUYV and NV12 input.
# auto uses what the driver reports. Try a _full value if dark and bright areas lose
# detail, or a limited one if black looks gray. MJPEG, which auto input_format usually
# picks, is always BT.601 full range and ignores this.
input_color = "auto"
# Positive pixel dimensions (width must be even) and frames per second.
width = 1920
height = 1080
fps = 30
# "auto" | "on" | "off": decode MJPEG on several CPU cores. auto: only above 1080p30.
# on: slightly lower latency at any size, for about a third more decoding CPU.
parallel_decode = "auto"
# Low-light noise removal. No strength option.
video_noise_removal = { enabled = false }
# Image path (supports ~/), scaled to fill; omit to keep the real background.
# Use only one background effect: image, blur or removal.
# background = "~/Pictures/background.jpg"
# Blur the background; strength: 0.0 = off, 1.0 = full blur.
background_blur = { enabled = false, strength = 0.5 }
# Remove the background to black (virtual camera has no transparency).
background_removal = { enabled = false }
# Face relighting. preset: "cooler" | "cool" | "neutral" | "warm" | "warmer".
studio_light = { enabled = false, strength = 1.0, preset = "neutral" }
# Redirect your eyes toward the camera while you look at the screen. No strength option.
eye_contact = { enabled = false }
# Zoom in and follow your face as you move. No strength option.
auto_frame = { enabled = false }

[service]
# Whole seconds after last reader: pause mic / stop camera; 0 = immediately.
idle_timeout_seconds = 5
