name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust clang libpipewire
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Lint and test
        run: |
          git config --global --add safe.directory '*'
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic
          cargo test --locked
      - run: ci/arch-package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: docker build --output type=local,dest=dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file ci/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
