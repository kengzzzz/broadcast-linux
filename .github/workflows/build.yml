name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "**.MD", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "**.MD", "LICENSE*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rustup clang libpipewire
      - uses: actions/checkout@v5
      - name: Lint and test
        run: |
          git config --global --add safe.directory '*'
          rustc --version
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic
          cargo test --locked

  tarball:
    if: github.ref_type == 'tag'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Check release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: docker build --output type=local,dest=dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --verify-tag --title "$GITHUB_REF_NAME" --notes-file ci/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
